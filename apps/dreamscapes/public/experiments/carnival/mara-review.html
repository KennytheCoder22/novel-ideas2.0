<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mara — source asset inspection</title><style>body{margin:0;background:#22252a;color:#ead6b8;font:16px system-ui}canvas{display:block;width:100vw;height:calc(100vh - 70px)}nav{height:70px;display:flex;align-items:center;gap:15px;padding:0 20px}button{padding:8px 15px;cursor:pointer}label{display:flex;gap:10px;align-items:center}</style><canvas></canvas><nav><strong>Mara · original GLB</strong><button id="front">Front</button><button id="side">Side</button><button id="back">Back</button><label>Turn <input id="turn" type="range" min="0" max="6.283185" step=".01" value="0"></label><output>Loading…</output></nav><script type="module">
import * as T from './vendor/three.module.js';import{GLTFLoader}from './vendor/GLTFLoader.js';
const renderer=new T.WebGLRenderer({canvas:document.querySelector('canvas'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputColorSpace=T.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
const scene=new T.Scene();scene.background=new T.Color('#292c32');const camera=new T.PerspectiveCamera(35,1,.01,50);camera.position.set(0,.5,3.7);camera.lookAt(0,0,0);scene.add(new T.HemisphereLight(0xffefd6,0x4d5368,1.5));const key=new T.DirectionalLight(0xffdba9,3);key.position.set(-2,4,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-2,right:2,top:2,bottom:-2});scene.add(key);const fill=new T.DirectionalLight(0xcbdfff,.8);fill.position.set(3,1,-2);scene.add(fill);
const floor=new T.Mesh(new T.PlaneGeometry(20,20),new T.MeshStandardMaterial({color:0x444448,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.612;floor.receiveShadow=true;scene.add(floor);
const gltf=await new GLTFLoader().loadAsync('./mara/mara.glb');scene.add(gltf.scene);gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});const sourceBox=new T.Box3().setFromObject(gltf.scene);document.querySelector('output').textContent='9,705 triangles · unrigged · no animation';
function draw(){renderer.setSize(innerWidth,innerHeight-70,false);camera.aspect=innerWidth/(innerHeight-70);camera.updateProjectionMatrix();renderer.render(scene,camera);}
function turn(a){gltf.scene.rotation.y=a;document.querySelector('#turn').value=a;draw();}
document.querySelector('#front').onclick=()=>turn(0);document.querySelector('#side').onclick=()=>turn(Math.PI/2);document.querySelector('#back').onclick=()=>turn(Math.PI);document.querySelector('#turn').oninput=e=>turn(+e.target.value);addEventListener('resize',draw);window.MaraAssetReview={turn,ready:true,bounds:sourceBox,scene:gltf.scene,renderer,camera,draw};draw();
</script></html>
