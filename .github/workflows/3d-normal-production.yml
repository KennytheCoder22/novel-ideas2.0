name: Normal 3D production gate
on:
  pull_request:
    paths:
      - 'api/3d-generate.ts'
      - 'lib/3d/**'
      - 'tests/3d/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/3d-normal-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  normal-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck:3d-production
      - run: npm run test:3d-production
