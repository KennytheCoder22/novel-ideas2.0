name: Workshop route
on:
  pull_request:
    paths:
      - 'app/3d-workshop.tsx'
      - 'app/_layout.tsx'
      - 'app/(tabs)/[libraryId].tsx'
      - 'lib/pwaRuntime.ts'
      - 'lib/savedLibraries.ts'
      - 'tests/routes/**'
      - '.github/workflows/workshop-route.yml'
      - 'vercel.json'
permissions:
  contents: read
jobs:
  route-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test tests/routes/workshop.test.cjs
      - run: node scripts/run-pwa-install-regressions.mjs
